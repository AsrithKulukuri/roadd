name: WhatsApp Concierge Evals & Reliability Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  concierge-evals:
    name: WhatsApp Concierge Evals (100+ cases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Concierge Regression & Unit Tests
        run: npm run test:concierge

      - name: Run Concierge Eval Suite (100+ Cases)
        run: npm run test:evals

